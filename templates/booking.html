{% extends "base.html" %}
{% block title %}Book {{ room['name'] }} — Niwas{% endblock %}

{% block extra_css %}
<style>
    .booking-container { padding: 120px 60px; max-width: 800px; margin: 0 auto; }
    .booking-card { background: var(--dark2); padding: 40px; border: 1px solid #222; border-radius: 4px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; color: var(--gray); font-size: 12px; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
    input { width: 100%; background: #000; border: 1px solid #333; padding: 12px; color: var(--white); border-radius: 2px; }
    input:focus { border-color: var(--amber); outline: none; }
</style>
{% endblock %}

{% block content %}
<div class="booking-container">
    <div class="booking-card">
        <h2 class="section-title" style="font-size: 40px;">Book <span>{{ room['name'] }}</span></h2>
        <form method="POST">
            <div class="form-group"><label>Full Name</label><input type="text" name="guest_name" required></div>
            <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
            <div class="form-group"><label>Phone</label><input type="tel" name="phone" required></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group"><label>Check-in</label><input type="date" name="check_in" required></div>
                <div class="form-group"><label>Check-out</label><input type="date" name="check_out" required></div>
            </div>
            <div class="form-group"><label>Number of Guests</label><input type="number" name="guests" min="1" required></div>
            <button type="submit" class="btn-amber" style="width: 100%; text-align: center; margin-top: 20px;">Confirm Booking</button>
        </form>
    </div>
</div>
{% endblock %}
